<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Liquidation Map</title>
<style>
html,body{margin:0;height:100%;background:#0b0e14;color:#cfd6e4;font-family:system-ui,-apple-system,sans-serif;overflow:hidden}
#bar{position:absolute;top:0;left:0;right:0;z-index:5;padding:6px 10px;padding-top:calc(6px + env(safe-area-inset-top))}
#row{display:flex;gap:6px;flex-wrap:nowrap}
button{background:#1a2030;color:#cfd6e4;border:1px solid #2b3550;border-radius:6px;padding:5px 9px;font-size:13px}
button.on{background:#2D6CDF;border-color:#2D6CDF;color:#fff}
#st{font-size:11px;line-height:1.35;margin-top:4px;min-height:30px}
#wrap{position:absolute;left:0;right:0;bottom:0;top:calc(76px + env(safe-area-inset-top))}
#heat,#chart{position:absolute;inset:0;width:100%;height:100%}
#heat{z-index:1;pointer-events:none}
#chart{z-index:2}
.up{color:#ef5350}.dn{color:#26a69a}.warn{color:#ff9800}.err{color:#ef5350}
</style>
</head>
<body>
<div id="bar">
  <div id="row">
    <button data-tf="5m">5m</button>
    <button data-tf="15m" class="on">15m</button>
    <button data-tf="1h">1h</button>
    <button data-tf="4h">4h</button>
    <button id="mode">Intensidad</button>
    <button id="lv">Niveles</button>
  </div>
  <div id="st">cargando…</div>
</div>
<div id="wrap"><canvas id="heat"></canvas><div id="chart"></div></div>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<script>
const $ = id => document.getElementById(id);
const wrap = $('wrap'), cv = $('heat'), ctx = cv.getContext('2d'), st = $('st');
const K = new URLSearchParams(location.search).get('k');
const store = {
  get(k, d) { try { return localStorage.getItem(k) || d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
let tf = '15m', data = null, mode = store.get('mode', 'int'), first = true;
let manualLines = [], cgLines = [];

const chart = LightweightCharts.createChart($('chart'), {
  autoSize: true,
  layout: { background: { type: 'solid', color: 'rgba(0,0,0,0)' }, textColor: '#cfd6e4' },
  grid: { vertLines: { color: 'rgba(255,255,255,0.04)' }, horzLines: { color: 'rgba(255,255,255,0.04)' } },
  timeScale: { timeVisible: true, secondsVisible: false, borderColor: '#2b3550' },
  rightPriceScale: { borderColor: '#2b3550' }
});
const series = chart.addCandlestickSeries({
  upColor: '#26a69a', downColor: '#ef5350', borderVisible: false,
  wickUpColor: '#26a69a', wickDownColor: '#ef5350'
});

const fmtV = v => v >= 1e6 ? (v / 1e6).toFixed(0) + 'M$' : (v / 1e3).toFixed(0) + 'K$';
const fmtP = p => Math.round(p).toLocaleString('en-US');

function ramp(r) {
  const a = [123, 44, 191], b = [45, 108, 223], c = [255, 214, 10];
  let f, t, k;
  if (r < 0.5) { f = a; t = b; k = r / 0.5; } else { f = b; t = c; k = (r - 0.5) / 0.5; }
  return f.map((v, i) => Math.round(v + (t[i] - v) * k));
}

function draw() {
  try { paint(); } catch (e) { console.error(e); }
  requestAnimationFrame(draw);
}

function paint() {
  const dpr = window.devicePixelRatio || 1;
  const w = wrap.clientWidth, h = wrap.clientHeight;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) {
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  if (!data) return;
  const ts = chart.timeScale();
  const n = data.candles.length;
  const x0 = ts.logicalToCoordinate(0), x1 = ts.logicalToCoordinate(1);
  if (x0 === null || x1 === null) return;
  const bw = Math.abs(x1 - x0);
  const size = data.heat.bin, vmax = data.heat.vmax || 1;

  const segs = (list, side) => {
    for (const [k, s, e, v] of list) {
      const xa = ts.logicalToCoordinate(s);
      const xb = e >= n - 1 ? w : ts.logicalToCoordinate(e);
      if (xa === null || xb === null) continue;
      const left = xa - bw / 2, right = e >= n - 1 ? w : xb + bw / 2;
      if (right < 0 || left > w) continue;
      const yt = series.priceToCoordinate((k + 1) * size);
      const yb = series.priceToCoordinate(k * size);
      if (yt === null || yb === null) continue;
      const r = Math.min(1, v / vmax);
      if (mode === 'int') {
        const [R, G, B] = ramp(r);
        ctx.fillStyle = `rgba(${R},${G},${B},${(0.15 + 0.6 * r).toFixed(2)})`;
      } else {
        const col = side === 'long' ? '38,166,154' : '239,83,80';
        ctx.fillStyle = `rgba(${col},${(0.12 + 0.6 * r).toFixed(2)})`;
      }
      ctx.fillRect(left, yt, right - left, Math.max(1, yb - yt));
    }
  };
  segs(data.heat.long, 'long');
  segs(data.heat.short, 'short');

  for (const a of data.asia) {
    const xa = ts.logicalToCoordinate(a.i0), xb = ts.logicalToCoordinate(a.i1), xe = ts.logicalToCoordinate(a.i2);
    const yH = series.priceToCoordinate(a.high), yL = series.priceToCoordinate(a.low);
    if (xa === null || xb === null || xe === null || yH === null || yL === null) continue;
    const l = xa - bw / 2, r = xb + bw / 2, e = xe + bw / 2;
    ctx.fillStyle = 'rgba(170,150,255,0.10)';
    ctx.fillRect(l, yH, r - l, yL - yH);
    ctx.strokeStyle = 'rgba(170,150,255,0.8)';
    ctx.lineWidth = 1;
    ctx.setLineDash([5, 4]);
    ctx.strokeRect(l, yH, r - l, yL - yH);
    ctx.beginPath();
    ctx.moveTo(r, yH); ctx.lineTo(e, yH);
    ctx.moveTo(r, yL); ctx.lineTo(e, yL);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(190,175,255,0.95)';
    ctx.font = '11px system-ui';
    ctx.textAlign = 'left';
    ctx.fillText('AH', r + 3, yH - 3);
    ctx.fillText('AL', r + 3, yL + 11);
  }

  ctx.font = '11px system-ui';
  ctx.textAlign = 'right';
  for (const z of data.zones) {
    if (z.value < 0.5 * vmax) continue;
    const y = series.priceToCoordinate(z.price);
    if (y === null || y < 0 || y > h) continue;
    ctx.fillStyle = z.side === 'short' ? 'rgba(239,83,80,0.95)' : 'rgba(38,166,154,0.95)';
    ctx.fillText(fmtV(z.value), w - 66, y + 4);
  }
}
requestAnimationFrame(draw);

function setLevels() {
  manualLines.forEach(l => series.removePriceLine(l));
  manualLines = [];
  const raw = store.get('lv', '');
  raw.split(',').map(x => parseFloat(x)).filter(x => x > 0).forEach(p => {
    manualLines.push(series.createPriceLine({ price: p, color: '#ff9800', lineWidth: 2, lineStyle: 0, axisLabelVisible: true, title: 'CG' }));
  });
}

function setCg(list) {
  cgLines.forEach(l => series.removePriceLine(l));
  cgLines = [];
  (list || []).slice(0, 5).forEach(z => {
    cgLines.push(series.createPriceLine({ price: z.price, color: '#ffb74d', lineWidth: 1, lineStyle: 2, axisLabelVisible: false, title: 'CG ' + fmtV(z.value) }));
  });
}

function setMarkers(d) {
  const mk = d.signals.map(s => s.type === 'high'
    ? { time: s.time, position: 'aboveBar', color: '#ef5350', shape: 'arrowDown', text: 'Barrido máx' + (s.confluence ? ' ★' : '') }
    : { time: s.time, position: 'belowBar', color: '#26a69a', shape: 'arrowUp', text: 'Barrido mín' + (s.confluence ? ' ★' : '') });
  mk.sort((a, b) => a.time - b.time);
  series.setMarkers(mk);
}

function status(d) {
  const above = d.zones.filter(z => z.price > d.price).sort((a, b) => b.value - a.value)[0];
  const below = d.zones.filter(z => z.price <= d.price).sort((a, b) => b.value - a.value)[0];
  const hora = new Date(d.updated * 1000).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
  const bad = Object.entries(d.oi_info).filter(([k, v]) => v !== 'ok').map(([k]) => k);
  let html = `${fmtP(d.price)} · OI ${d.oi_used.map(x => x[0].toUpperCase()).join('·')} · ${hora}` +
    (d.alerts_on ? ' · TG✓' : '');
  html += '<br>' +
    (above ? `<span class="up">▲ cortos ${fmtP(above.price)} (${fmtV(above.value)})</span>` : '') + '  ' +
    (below ? `<span class="dn">▼ largos ${fmtP(below.price)} (${fmtV(below.value)})</span>` : '');
  if (bad.length) html += `<br><span class="warn">sin datos: ${bad.join(', ')}</span>`;
  if (d.note) html += `<br><span class="err">${String(d.note).slice(0, 70)}</span>`;
  st.innerHTML = html;
}

async function load() {
  try {
    const url = '/api/data?tf=' + tf + (K ? '&k=' + encodeURIComponent(K) : '');
    const r = await fetch(url);
    if (r.status === 401) throw new Error('falta la clave: añade ?k=TU_CLAVE al enlace');
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    series.setData(d.candles);
    data = d;
    setMarkers(d);
    setCg(d.cg);
    setLevels();
    status(d);
    if (first) { chart.timeScale().fitContent(); first = false; }
  } catch (e) {
    st.innerHTML = `<span class="err">Error: ${String(e.message).slice(0, 110)}</span>`;
  }
}

function paintMode() { $('mode').textContent = mode === 'int' ? 'Intensidad' : 'Largos/Cortos'; }
paintMode();
$('mode').onclick = () => { mode = mode === 'int' ? 'side' : 'int'; store.set('mode', mode); paintMode(); };
$('lv').onclick = () => {
  const v = prompt('Niveles de Coinglass (precios separados por comas; vacío para borrar):', store.get('lv', ''));
  if (v !== null) { store.set('lv', v.replace(/[^0-9.,]/g, '')); setLevels(); }
};
document.querySelectorAll('button[data-tf]').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('button[data-tf]').forEach(x => x.classList.remove('on'));
    btn.classList.add('on');
    tf = btn.dataset.tf; first = true; data = null;
    load();
  };
});
load();
setInterval(load, 60000);
</script>
</body>
</html>
