<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Liquidation Heatmap BTC</title>
<style>
html,body{margin:0;height:100%;background:#000;color:#cfd6e4;font-family:system-ui,-apple-system,sans-serif;overflow:hidden}
#bar{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 10px;padding-top:calc(8px + env(safe-area-inset-top));background:#0b0e14}
button{background:#1a2030;color:#cfd6e4;border:1px solid #2b3550;border-radius:6px;padding:6px 10px;font-size:14px;cursor:pointer}
button:hover{background:#222a3d}
button.on{background:#2D6CDF;border-color:#2D6CDF;color:#fff}
button.tg.on{background:#7B2CBF;border-color:#7B2CBF}
#pools{flex-basis:100%;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:12px;color:#cfd6e4;padding-top:2px}
#pools label{display:inline-flex;align-items:center;gap:3px;cursor:pointer;white-space:nowrap}
#pools input[type=checkbox]{accent-color:#2D6CDF;margin:0}
#pools .pv{color:#9aa4b8;min-width:38px}
#pools .tot{font-weight:600}
#pools .cum{color:#9aa4b8}
#pools .bk{color:#9fd8ff}
#pools input[type=range]{width:90px;accent-color:#f0e60a}
#pools .grad{width:44px;height:8px;border-radius:3px;background:linear-gradient(90deg,#008f8f,#0fbf0f,#f0e60a,#e8100a)}
#pools button{padding:2px 8px;font-size:12px}
#pools input.low{border:2px solid #f0e60a;background:#2a2600;color:#fff}
#st{margin-left:auto;font-size:11px;text-align:right;line-height:1.3;min-width:150px}
#wrap{position:absolute;left:0;right:0;bottom:0;top:90px}
#heat,#chart{position:absolute;inset:0;width:100%;height:100%}
#heat{z-index:1;pointer-events:none}
#chart{z-index:2}
#fx{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none}
#val{position:absolute;right:8px;top:6px;z-index:8;background:rgba(11,14,20,.97);border:1px solid #2b3550;border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.45;display:none;width:300px;max-height:80%;overflow-y:auto}
#val h4{margin:8px 0 4px;font-size:12px;color:#aab3c5;font-weight:600}
#val .big{font-size:15px;font-weight:700}
#val .ok{color:#26a69a}#val .warn{color:#FFD60A}#val .bad{color:#ef5350}
#val .muted{color:#7f8aa3;font-size:11px}
#info{position:absolute;left:10px;top:8px;z-index:6;max-width:calc(100% - 110px);pointer-events:none;text-shadow:0 0 3px #000}
#hdr{font-size:12px;color:#c9c9c9;letter-spacing:.2px}
#brow{margin-top:5px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
#bias{display:flex;flex-wrap:wrap;gap:6px;font-size:12px;pointer-events:auto}
#sig{pointer-events:auto}#sig:empty{display:none}
#sig .sig{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:5px;font-size:12px;font-weight:700;letter-spacing:.3px;background:rgba(11,14,20,.85);border:1px solid #2b3550;line-height:1.5}
#sig .sig small{font-weight:500;color:#9aa4b8;font-size:11px}
#sig .compra{color:#26a69a;border-color:#26a69a}
#sig .espera{color:#FFD60A;border-color:#8a7a1a}
#sig .venta{color:#ef5350;border-color:#ef5350}
#sigp{position:absolute;left:8px;top:6px;z-index:8;background:rgba(11,14,20,.97);border:1px solid #2b3550;border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.45;display:none;width:320px;max-width:calc(100% - 16px);max-height:calc(100% - 12px);overflow-y:auto;box-sizing:border-box}
#sigp .hh{display:flex;align-items:center;justify-content:space-between;gap:8px}
#sigp .x{padding:2px 10px}
#sigp h4{margin:9px 0 3px;font-size:12px;color:#aab3c5;font-weight:600}
#sigp .v{padding:3px 0;border-top:1px solid rgba(43,53,80,.7)}
#sigp table{width:100%;border-collapse:collapse;font-size:12px}
#sigp td,#sigp th{padding:2px 4px;text-align:right;font-weight:400}
#sigp th{color:#8b95ab;font-size:11px}
#sigp td:first-child,#sigp th:first-child{text-align:left;color:#aab3c5}
#sigp .ok{color:#26a69a}#sigp .bad{color:#ef5350}#sigp .warn{color:#FFD60A}#sigp .muted{color:#8b95ab;font-size:11.5px}
#sigp .compra{color:#26a69a}#sigp .espera{color:#FFD60A}#sigp .venta{color:#ef5350}
#bias .b{display:inline-flex;align-items:center;gap:5px;padding:2px 7px;border-radius:5px;background:rgba(11,14,20,.8);border:1px solid #2b3550}
#bias .mini{display:inline-block;width:56px;height:6px;border-radius:3px;background:#ff9f1c;overflow:hidden}
#bias .mini i{display:block;height:100%;background:#2ec4ff}
#toasts{position:absolute;right:8px;bottom:46px;z-index:9;display:flex;flex-direction:column;gap:6px;align-items:flex-end;pointer-events:none}
.toast{background:rgba(11,14,20,.95);border:1px solid #2b3550;border-left:3px solid #ff9f1c;border-radius:8px;padding:6px 10px;font-size:12.5px;line-height:1.35;max-width:290px;animation:tin .25s ease-out;transition:opacity .4s}
.toast.short{border-left-color:#2ec4ff}
@keyframes tin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.pulse{position:absolute;z-index:4;border-radius:50%;border:2px solid #ff9f1c;pointer-events:none;animation:pulse 1.4s ease-out forwards}
.pulse.short{border-color:#2ec4ff}
@keyframes pulse{from{transform:scale(.3);opacity:1}to{transform:scale(2.6);opacity:0}}
#zones{display:none;margin-top:5px;background:rgba(11,14,20,.85);border:1px solid #2b3550;border-radius:8px;padding:6px 8px;font-size:12px;line-height:1.5;width:max-content;max-width:100%}
#help{position:absolute;right:8px;top:6px;z-index:8;background:rgba(11,14,20,.97);border:1px solid #2b3550;border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.45;display:none;width:390px;max-width:calc(100% - 16px);max-height:calc(100% - 12px);overflow-y:auto;box-sizing:border-box}
#help .hh{display:flex;align-items:center;justify-content:space-between;gap:8px}
#help .hh b{font-size:15px}
#help .x{padding:2px 10px}
#help .muted{color:#8b95ab;font-size:11.5px}
#help details{border-left:3px solid var(--c);background:rgba(255,255,255,.035);border-radius:6px;margin:6px 0;padding:0 8px}
#help summary{cursor:pointer;padding:8px 0;font-weight:600;list-style:none}
#help summary::-webkit-details-marker{display:none}
#help summary::before{content:'▸ ';color:var(--c)}
#help details[open] summary::before{content:'▾ '}
#help .it{display:flex;gap:9px;align-items:flex-start;padding:5px 0;border-top:1px solid rgba(43,53,80,.7)}
#help .ic{flex:0 0 30px;margin-top:2px}
#help .ic.t{display:inline-block;text-align:center;color:var(--c);font-weight:700;font-size:12px}
#help .warn{color:#FFD60A}
#cfg{position:absolute;right:8px;top:6px;z-index:8;background:rgba(11,14,20,.96);border:1px solid #2b3550;border-radius:10px;padding:10px;font-size:13px;display:none;width:250px}
#cfg .row{margin-bottom:10px}
#cfg .lbl{font-size:11px;color:#aab3c5;margin-bottom:4px}
#cfg button{padding:5px 9px;font-size:13px;margin:0 4px 4px 0}
#cfg input[type=range]{width:100%}
.muted2{color:#8b95ab;font-size:11px}
.L{color:#ff9f1c}.S{color:#2ec4ff}.src{color:#7fb0ff}.err{color:#ef5350}.rt{color:#26a69a}
#st a{color:#7fb0ff;text-decoration:none}
.price-live{color:#26a69a;font-weight:700}.price-offline{color:#ef5350;font-weight:700}
@media (max-width:600px){#hdr{font-size:10.5px}#bias{font-size:11px}#sig .sig{font-size:11px}#bias .mini{width:40px}#zones{font-size:11px}#pools{font-size:11px}button{padding:5px 8px;font-size:13px}}
</style>
</head>
<body>
<div id="bar">
  <button data-tf="5m" class="on">5m</button>
  <button data-tf="15m">15m</button>
  <button data-tf="1h">1h</button>
  <button data-tf="4h">4h</button>
  <button data-tf="1d">1D</button>
  <button id="bVal">✓ Validez</button>
  <button id="bCfg">⚙</button>
  <button id="bHelp" title="Manual: qué es cada cosa">? Manual</button>
  <div id="st">cargando…</div>
  <div id="pools">
    <span>Pools:</span>
    <label><input type="checkbox" data-pool="3">3X: <span class="pv" data-pv="3">–</span></label>
    <label><input type="checkbox" data-pool="5">5X: <span class="pv" data-pv="5">–</span></label>
    <label><input type="checkbox" data-pool="10">10X: <span class="pv" data-pv="10">–</span></label>
    <label><input type="checkbox" data-pool="25">25X: <span class="pv" data-pv="25">–</span></label>
    <label><input type="checkbox" data-pool="50">50X: <span class="pv" data-pv="50">–</span></label>
    <label><input type="checkbox" data-pool="100">100X: <span class="pv" data-pv="100">–</span></label>
    <span class="tot">Total: <span id="pTot">–</span></span>
    <span class="cum" id="pCum"></span>
    <span class="cum" id="pAt"></span>
    <span class="cum bk" id="pBook"></span>
    <label title="Grosor de cada tramo: ≈ grupo × 5 puntos. Automático = precio / 10.000">Grupo <input type="number" id="pGroup" min="1" max="40" step="0.5" style="width:62px"></label>
    <button id="bAuto" class="tg">Auto</button>
    <span class="grad"></span><input type="range" id="pInt" min="0.3" max="3" step="0.1" title="Intensidad del color">
  </div>
</div>
<div id="wrap">
  <canvas id="heat"></canvas><div id="chart"></div><canvas id="fx"></canvas>
  <div id="val"></div>
  <div id="help"></div>
  <div id="sigp"></div>
  <div id="info"><div id="hdr"></div><div id="brow"><span id="sig"></span><div id="bias"></div></div><div id="zones"></div></div><div id="toasts"></div>
  <div id="cfg">
    <div class="row"><div class="lbl">Mapa</div><div id="cMap"></div></div>
    <div class="row"><div class="lbl">Vista</div><div id="cView"></div></div>
    <div class="row"><div class="lbl">Capas</div>
      <button id="bProf" class="tg on">Perfil</button><button id="bPanes" class="tg">Paneles</button><button id="bMode" class="tg">Calor</button><button id="bZones" class="tg">Zonas</button>
      <button id="bAsia" class="tg">Asia</button><button id="bLiq" class="tg">Liq</button><button id="bBook" class="tg">Libro</button>
      <button id="bHl" class="tg" title="Posiciones reales de Hyperliquid: dónde se liquidan las más grandes">HL</button></div>
    <div class="row"><div class="lbl">Paneles de abajo (hasta 3)</div><div id="cPanes"></div></div>
    <div class="row"><div class="lbl">Exchanges del Open Interest</div><div id="cEx"></div></div>
    <div class="row"><div class="lbl">Modelo</div><div id="cModel"></div></div>
    <div class="row"><div class="lbl">Apalancamientos</div><div id="cLev"></div></div>
    <div class="row"><div class="lbl">Mostrar solo desde: <span id="cMinV"></span>% de la zona más fuerte</div>
      <input type="range" id="cMin" min="0" max="40" step="1"></div>
  </div>
</div>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<script>
const K = new URLSearchParams(location.search).get('k');
const TFS = { '5m': 300, '15m': 900, '1h': 3600, '4h': 14400, '1d': 86400 };
const ALL = [3, 5, 10, 25, 50, 100];
const TIER_COL = { 3: '#f472b6', 5: '#a78bfa', 10: '#4f8cff', 25: '#1fd11f', 50: '#f2ea0c', 100: '#e8140c' };
// vista Pro: 4 colores fijos, de menos a más (turquesa, verde, amarillo, rojo)
const PRO_COLS = ['#008f8f', '#0fbf0f', '#f0e60a', '#e8100a'];
const MODEL_NAME = { auto: 'Auto (calibrado)', oi: 'Open Interest', vol: 'Volumen', hl: 'Hyperliquid real' };
const WARM = [[0, 0, 110], [0, 150, 150], [0, 200, 0], [240, 240, 0], [255, 0, 0]];

const CFG_VER = 9;
// paneles de abajo por defecto: en el móvil dos (liquidaciones y CVD), en pantallas anchas los tres
function defaultPanes() { return (window.innerWidth || 1000) < 600 ? ['liq', 'cvd'] : ['doi', 'liq', 'cvd']; }
let cfg = { ver: CFG_VER, model: 'auto', levs: [25, 50, 100], minPct: 24, view: 'pro', book: false, intensity: 1, group: null, ex: [], panes: true,
  paneList: defaultPanes(), hl: true, hlLevs: [3, 5, 10, 25, 50, 100], map: 'liq' };
try {
  const saved = JSON.parse(localStorage.getItem('liq_cfg') || '{}');
  // la v7 y la v8 se conservan; la paleta fría y la vista «Limpia» ya no existen
  if (saved.ver === 7 || saved.ver === 8 || saved.ver === CFG_VER) {
    Object.assign(cfg, saved);
    delete cfg.palette;
    if (cfg.view !== 'pro' && cfg.view !== 'full') cfg.view = 'pro';
    if (!MODEL_NAME[cfg.model]) cfg.model = 'auto';
    if (cfg.panes === undefined) cfg.panes = true;
    if (!Array.isArray(cfg.paneList)) cfg.paneList = defaultPanes();     // de la v8: se añade el CVD
    if (cfg.hl === undefined) cfg.hl = true;
    if (!['liq', 'book', 'both'].includes(cfg.map)) cfg.map = 'liq';
    if (!Array.isArray(cfg.hlLevs) || !cfg.hlLevs.length) cfg.hlLevs = [3, 5, 10, 25, 50, 100];
    cfg.ver = CFG_VER;
  }
} catch (e) {}
function saveCfg() { try { localStorage.setItem('liq_cfg', JSON.stringify(cfg)); } catch (e) {} }

const bar = document.getElementById('bar');
const wrap = document.getElementById('wrap');
const cv = document.getElementById('heat');
const ctx = cv.getContext('2d');
const st = document.getElementById('st');
const zonesEl = document.getElementById('zones');
const hdr = document.getElementById('hdr');
const biasEl = document.getElementById('bias');
const toastsEl = document.getElementById('toasts');
const bPanes = document.getElementById('bPanes');
const cfgEl = document.getElementById('cfg');
const bMode = document.getElementById('bMode');
const bAsia = document.getElementById('bAsia');
const bZones = document.getElementById('bZones');
const bProf = document.getElementById('bProf');
const bCfg = document.getElementById('bCfg');
const bLiq = document.getElementById('bLiq');
const bBook = document.getElementById('bBook');
const bVal = document.getElementById('bVal');
const valEl = document.getElementById('val');
const fx = document.getElementById('fx');
const fctx = fx.getContext('2d');
let tf = '5m', data = null, first = true, sideMode = false, showAsia = false, showZones = false, showProf = true;
let lines = [], lastSig = '', version = 0;
// Precio real recibido desde Binance (WebSocket)
let livePrice = null, previousLivePrice = null, ws = null, wsRetry = null, priceLine = null, lastLiveUi = 0;
let wsLive = false, liveBar = null, showLiq = false, valTimer = null, zoneLines = [], tindex = {};
let liveCursor = 0, liveBuf = [], liqHist = new Map(), doiMap = new Map(), zoneRange = null, toastBuf = {}, lastZoneLines = 0;
let cvdD = new Map(), cvdCum = [[], []];   // CVD: delta por vela [futuros, spot] y acumulado por índice de vela
let fundAt = [], fuelArr = [];            // funding y «gasolina» por índice de vela
const bHl = document.getElementById('bHl');

// Hora local del dispositivo (la misma que muestra la app de Binance); los datos siguen en UTC.
function fmtLocalFull(t) {
  return new Date(t * 1000).toLocaleString('es-ES', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
}
function tickLocal(t, type) {
  const d = new Date(t * 1000);
  if (type === 0) return String(d.getFullYear());
  if (type === 1) return d.toLocaleString('es-ES', { month: 'short' });
  if (type === 2) return d.toLocaleString('es-ES', { day: 'numeric', month: 'short' });
  return d.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
}

const chart = LightweightCharts.createChart(document.getElementById('chart'), {
  autoSize: true,
  localization: { locale: 'es-ES', timeFormatter: fmtLocalFull },
  layout: { background: { type: 'solid', color: 'rgba(0,0,0,0)' }, textColor: '#cfd6e4' },
  grid: { vertLines: { color: 'rgba(255,255,255,0.04)' }, horzLines: { color: 'rgba(255,255,255,0.04)' } },
  timeScale: { timeVisible: true, secondsVisible: false, borderColor: '#2b3550', rightOffset: 18, tickMarkFormatter: tickLocal },
  rightPriceScale: { borderColor: '#2b3550' }
});
const series = chart.addCandlestickSeries({
  upColor: '#26a69a', downColor: '#ef5350', borderVisible: false,
  wickUpColor: '#26a69a', wickDownColor: '#ef5350',
  lastValueVisible: false, priceLineVisible: false,   // la línea «BTC» propia ya marca el precio
  // el encuadre automático incluye las zonas fuertes cercanas, no solo las velas
  autoscaleInfoProvider: (original) => {
    const r = original();
    if (!r || !r.priceRange || !zoneRange) return r;
    return { priceRange: { minValue: Math.min(r.priceRange.minValue, zoneRange[0]), maxValue: Math.max(r.priceRange.maxValue, zoneRange[1]) }, margins: r.margins };
  }
});

// Paneles inferiores (dibujados en el lienzo superior), hasta 3 a elegir en ⚙: ΔOI, liquidaciones reales y CVD
const PANE_IDS = ['doi', 'liq', 'cvd', 'fund', 'fuel'];
const PANE_NAME = { doi: 'ΔOI', liq: 'Liquidaciones', cvd: 'CVD', fund: 'Funding', fuel: 'Gasolina' };
const PANE_SPACE = [0, 0.22, 0.36, 0.48];       // parte del alto para 0, 1, 2 o 3 paneles
function paneList() { return cfg.panes ? PANE_IDS.filter(x => cfg.paneList.includes(x)) : []; }
function panesBottom() { return PANE_SPACE[paneList().length]; }
function applyPanes() {
  const pb = panesBottom();
  series.priceScale().applyOptions({ scaleMargins: pb ? { top: 0.06, bottom: pb + 0.02 } : { top: 0.08, bottom: 0.08 } });
  bPanes.classList.toggle('on', cfg.panes);
}
function paneHeight() {
  const t = chart.timeScale();
  return wrap.clientHeight - ((t.height && t.height()) || 28);
}
function paneGeom() {
  const ph = paneHeight(), list = paneList(), yA = ph * (1 - panesBottom()), hh = (ph - yA) / (list.length || 1);
  return { ph, yA, panes: list.map((id, i) => ({ id, y0: yA + i * hh, y1: yA + (i + 1) * hh })) };
}
function priceBottom() { return paneList().length ? paneGeom().yA : wrap.clientHeight; }

// Línea de precio REAL: se crea con el primer precio conocido (nunca en 0)
function countdown() {
  if (!liveBar) return '';
  const left = Math.max(0, Math.floor(liveBar.time + TFS[tf] - Date.now() / 1000));
  const h = Math.floor(left / 3600), m = Math.floor((left % 3600) / 60), s = left % 60;
  const mm = String(m).padStart(2, '0'), ss = String(s).padStart(2, '0');
  return h ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
}
function setPriceLine(price, color) {
  const title = 'BTC ' + countdown();
  const pro = cfg.view === 'pro';
  const col = pro ? '#c83232' : (color || '#26a69a');
  if (!priceLine) priceLine = series.createPriceLine({ price, color: col, lineWidth: pro ? 1 : 2, lineStyle: pro ? 1 : 0, axisLabelVisible: true, title });
  else priceLine.applyOptions({ price, color: col, title, lineWidth: pro ? 1 : 2, lineStyle: pro ? 1 : 0 });
}
function tickCountdown() {
  if (priceLine && liveBar) priceLine.applyOptions({ title: 'BTC ' + countdown() });
}

function layout() { wrap.style.top = bar.offsetHeight + 'px'; }

function rampN(stops, k) {
  const n = stops.length - 1;
  const x = Math.min(0.999999, Math.max(0, k)) * n;
  const i = Math.floor(x), f = x - i;
  return stops[i].map((v, j) => Math.round(v + (stops[i + 1][j] - v) * f));
}

function fillFor(ratio, longShare) {
  const k = Math.pow(ratio, 0.55);
  if (sideMode) {
    const a = (0.2 + 0.7 * k).toFixed(2);
    return longShare >= 0.5 ? `rgba(255,159,28,${a})` : `rgba(46,196,255,${a})`;
  }
  const [r, g, b] = rampN(WARM, k);
  const a = 0.4 + 0.58 * k;
  return `rgba(${r},${g},${b},${a.toFixed(2)})`;
}

function profWidth(w) { return cfg.view === 'pro' ? Math.min(w * 0.24, 420) : Math.min(w * 0.22, 280); }

function signature() {
  const ts = chart.timeScale();
  const cs = data.candles;
  return [wrap.clientWidth, wrap.clientHeight,
    series.priceToCoordinate(data.price), series.priceToCoordinate(data.price * 1.01),
    ts.timeToCoordinate(cs[0].time), ts.timeToCoordinate(cs[cs.length - 1].time),
    ts.options().barSpacing, sideMode, showProf, showLiq, cfg.minPct, cfg.view, cfg.book, cfg.intensity, cfg.panes, cfg.hl, cfg.map,
    paneList().join(','),
    Math.round((livePrice ?? data.price) / (data.heat.size || 1)), version].join('|');
}

// Conversión rápida precio→y y vela→x para el fotograma en curso. El eje de precios es lineal y las velas van a
// distancia fija, así que con dos puntos de Lightweight Charts basta (miles de tramos por fotograma sin preguntarle uno a uno).
let M = null;
function mapper() {
  const ts = chart.timeScale(), cs = data.candles, n = cs.length;
  const xa = ts.timeToCoordinate(cs[0].time), xb = n > 1 ? ts.timeToCoordinate(cs[n - 1].time) : null;
  const p0 = data.price, p1 = data.price * 1.01;
  const ya = series.priceToCoordinate(p0), yb = series.priceToCoordinate(p1);
  const dx = xa !== null && xb !== null ? (xb - xa) / (n - 1) : null;
  const ky = ya !== null && yb !== null ? (yb - ya) / (p1 - p0) : null;
  return {

function drawTime(w, h) {
  const ts = chart.timeScale();
  const bs = ts.options().barSpacing;
  const lastT = data.candles[data.candles.length - 1].time;
  const xLast = M.x(lastT);
  const half = data.heat.size / 2;
  const pro = cfg.view === 'pro';
  const max = pro ? proMax() : data.heat.max;
  const minR = Math.max(0.005, cfg.minPct / 100);
  const FF = data.heat.F || {}, FL = FF.L, FS = FF.S;
  if (!(max > 0) || xLast === null) return;
  const groups = new Map();
  for (const [p, t0, t1, mL, mS] of data.heat.segments) {
    const j = tindex[t1];
    const L = FL && j !== undefined ? mL * FL[j] : mL;
    const S = FS && j !== undefined ? mS * FS[j] : mS;
    if (L + S <= 0) continue;
    const ratio = Math.min(1, (L + S) / max);
    if (ratio < minR) continue;
    const y1 = M.y(p + half);
    const y2 = M.y(p - half);
    if (y1 === null || y2 === null || y2 < 0 || y1 > h) continue;      // fuera de la vista: no se pinta
    let x1 = M.x(t0);
    let x2 = t1 >= lastT ? xLast : M.x(t1);
    if (x1 === null || x2 === null) continue;
    x1 -= bs / 2; x2 += bs / 2;
    if (x2 < 0 || x1 > w) continue;
    const xs = Math.max(0, x1);
    const col = pro ? proColor(ratio, minR, L / (L + S)) : fillFor(ratio, L / (L + S));
    let g = groups.get(col);
    if (!g) groups.set(col, g = []);
    g.push(xs, y1, x2 - xs, Math.max(1, y2 - y1));
  }
  fillGroups(ctx, groups);
  if (pro && bs >= 3) drawStripes(w, h, bs);
}

function smoothActive(act, size) {

function drawProfile(w) {
  const act = cfg.view === 'pro' ? (data.profAct || data.heat.active) : data.heat.active;

  let mx = 0;

  const ps = chart.priceScale('right');
  const pw = (ps && ps.width && ps.width()) || 70;
  const xr = w - pw - 2;

  const half = data.heat.size / 2;
  const groups = new Map(), add = (col, x, y, ww, hh) => { let g = groups.get(col); if (!g) groups.set(col, g = []); g.push(x, y, ww, hh); };
  const yLim = priceBottom();
  for (const [p, L, S, tv] of act) {

    const y2 = M.y(p - half);

    const len = Math.pow((L + S) / mx, 0.7) * maxLen;

    const hh = Math.max(1, y2 - y1);

    } else {
      let x = xr;

        add(TIER_COL[ALL[i]], x - sl, y1, sl, hh);

function cumulativeSides() {
  // cortos por encima del precio (se liquidan si sube) y largos por debajo (si baja), acumulados desde el precio
  const px = livePrice ?? data.price;
  const act = data.heat.active || [];
  const up = act.filter(a => a[0] > px).sort((a, b) => a[0] - b[0]);
  const dn = act.filter(a => a[0] < px).sort((a, b) => b[0] - a[0]);
  let c = 0;
  const upC = up.map(a => [a[0], (c += a[2])]);
  c = 0;
  const dnC = dn.map(a => [a[0], (c += a[1])]);
  return { px, upC, dnC };
}

function drawCumulative(xr, maxLen) {
  if (cfg.view !== 'pro') return;
  const { upC, dnC } = cumulativeSides();
  const top = Math.max(upC.length ? upC[upC.length - 1][1] : 0, dnC.length ? dnC[dnC.length - 1][1] : 0);
  if (!(top > 0)) return;
  for (const [arr, col] of [[upC, '#ff5a5a'], [dnC, '#3ddc84']]) {
    if (!arr.length) continue;
    ctx.strokeStyle = col;
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    let started = false;
    for (const [p, cv] of arr) {
      const y = M.y(p);
      if (y === null) continue;
      const x = xr - (cv / top) * maxLen;
      if (!started) { ctx.moveTo(xr, y); started = true; }
      ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
}

function paneBuckets(entries, bs, xMax, avg) {
  // velas de ≥ 3 px: una barra por vela, centrada en ella; más finas: se suman por columnas de 3 px para que se vean
  // (avg: la media de la columna, para tasas como el funding, que no se suman)
  const out = new Map(), col = bs >= 3 ? 0 : 3;
  const wid = col ? col - 0.6 : Math.max(1.5, bs * 0.7);
  for (const [t, up, dn] of entries) {
    const x = M.x(t);
    if (x === null || x < 0 || x > xMax) continue;
    const left = col ? Math.floor(x / col) * col : x - wid / 2, b = out.get(left) || [0, 0, wid, 0];
    b[0] += up; b[1] += dn; b[3]++;
    out.set(left, b);
  }
  if (avg) for (const b of out.values()) { b[0] /= b[3]; b[1] /= b[3]; }
  return out;
}

function drawPaneBars(buckets, y0, y1, upCol, dnCol, xMax, boost, linear) {
  // escala logarítmica centrada en cero: una cascada enorme ya no aplasta al resto (linear: escala normal)
  const top = y0 + 18, bot = y1 - 3, zero = Math.round((top + bot) / 2), half = (bot - top) / 2;
  fctx.fillStyle = 'rgba(43,53,80,0.8)';
  fctx.fillRect(0, zero, xMax, 1);
  const vals = [];
  for (const [u, d] of buckets.values()) { if (u > 0) vals.push(u); if (d > 0) vals.push(d); }
  if (!vals.length) return 0;
  vals.sort((p, q) => p - q);
  const unit = Math.max(1e-12, vals[Math.floor(vals.length / 2)] / boost);   // boost alto = lo pequeño se ve más
  const f = linear ? (v) => v : (v) => Math.log10(1 + v / unit), m = f(vals[vals.length - 1]);
  const ups = [], dns = [];
  for (const [left, [u, d, wid]] of buckets) {
    const x = Math.max(0, left), bwid = Math.min(left + wid, xMax) - x;   // sin pisar el eje de precios
    if (bwid <= 0) continue;
    if (u > 0) { const hgt = Math.max(1.5, f(u) / m * half); ups.push(x, zero - hgt, bwid, hgt); }
    if (d > 0) { const hgt = Math.max(1.5, f(d) / m * half); dns.push(x, zero + 1, bwid, hgt); }
  }
  fillGroups(fctx, [[upCol, ups], [dnCol, dns]]);
  return vals[vals.length - 1];
}

// CVD: compras − ventas a mercado acumuladas desde la primera vela cargada (futuros de Binance y spot)
function preparePanes(d) {
  // funding: el que se va acumulando en cada vela (el próximo cobro); en el periodo abierto, el previsto
  const cs = d.candles, fr = (d.funding || []).slice().sort((a, b) => a[0] - b[0]);
  const pred = d.ctx && d.ctx.funding !== undefined ? d.ctx.funding : null;
  let j = 0;
  fundAt = cs.map(c => { while (j < fr.length && fr[j][0] <= c.time) j++; return j < fr.length ? fr[j][1] : pred; });
  const fm = new Map((d.fuel || []).map(r => [r[0], [r[1], r[2]]]));
  fuelArr = cs.map(c => fm.get(c.time) || null);
  prepareCvd();
}
function prepareCvd() {
  const cum = [[], []], acc = [0, 0], seen = [false, false];
  for (const c of data.candles) {
    const r = cvdD.get(c.time);
    for (const k of [0, 1]) {
      const v = r ? r[k] : null;
      if (v !== null && v !== undefined) { acc[k] += v; seen[k] = true; }
      cum[k].push(seen[k] ? acc[k] : null);
    }
  }
  cvdCum = cum;
}
let cvdLiveAt = 0;
function setCvdLive(t, perp, now) {
  // vela en curso: el delta de futuros llega con cada mensaje de vela del WebSocket (se repinta como mucho 1 vez por segundo)
  if (!data || tindex[t] === undefined || !Number.isFinite(perp)) return;
  const r = cvdD.get(t) || [null, null];
  if (r[0] === perp) return;
  r[0] = perp; cvdD.set(t, r);
  now = now || Date.now();
  if (now - cvdLiveAt < 1000) return;
  cvdLiveAt = now; prepareCvd(); version++;
}
function visibleIdx(xMax) {
  const cs = data.candles, out = [];
  for (let i = 0; i < cs.length; i++) {
    const x = M.x(cs[i].time);

}
function drawLine(pts, y0, y1, col, lo, hi) {
  if (pts.length < 2 || !(hi > lo)) return;

  fctx.beginPath();
  pts.forEach(([x, v], k) => { const y = bot - (v - lo) * sc; if (k) fctx.lineTo(x, y); else fctx.moveTo(x, y); });
  fctx.strokeStyle = col; fctx.lineWidth = 1.4; fctx.stroke();
}
const sgnM = (x) => (x >= 0 ? '+' : '') + fmtM(x);
const PANE_DRAW = {
  doi(y0, y1, xMax, bs) {
    const m = drawPaneBars(paneBuckets([...doiMap].map(([t, v]) => [t, Math.max(0, v), Math.max(0, -v)]), bs, xMax),
      y0, y1, 'rgba(38,166,154,0.9)', 'rgba(239,83,80,0.9)', xMax, 1);
    return { titles: data.model === 'vol'

  },
  liq(y0, y1, xMax, bs) {

      y0, y1, 'rgba(46,196,255,0.95)', 'rgba(255,159,28,0.95)', xMax, 5);
    const lq = data.liqs || {}, n = lq.exchanges || 8, cz = lq.cz_markets || 0;
    const src = `${n} exchanges${cz ? ` + ${cz} vía Coinalyze` : ''}`;

      'Liquidaciones reales · log · ▲ cortos  ▼ largos', 'Liq. reales · log · ▲ cortos ▼ largos', 'Liq. reales'], right: m > 0 ? 'máx ' + fmtM(m) : '' };
  },
  cvd(y0, y1, xMax) {

    const entries = data.candles.map((c, i) => [c.time, Math.max(0, fundAt[i] || 0), Math.max(0, -(fundAt[i] || 0))]);
    const m = drawPaneBars(paneBuckets(entries, bs, xMax, true), y0, y1, 'rgba(255,159,28,0.85)', 'rgba(46,196,255,0.85)', xMax, 1, true);

  },

// ───── mapa de liquidez (libro de órdenes en el tiempo): una imagen de velas × tramos, se pinta de una vez
const BOOK_PAL = [null, [26, 35, 96, 0.30], [32, 58, 150, 0.45], [40, 95, 205, 0.60], [56, 140, 240, 0.74],
  [98, 188, 255, 0.86], [175, 228, 255, 0.94], [255, 255, 255, 1]];
let bookImg = null;
function buildBookImg(bm) {
  bookImg = null;
  if (!bm || bm.error || !bm.rows || !bm.rows.length || !bm.nk) return;
  const n = bm.rows.length, nk = bm.nk;
  const off = document.createElement('canvas');
  off.width = n; off.height = nk;
  const g = off.getContext('2d');
  const img = g.createImageData(n, nk);
  let lastRow = -1;
  for (let i = 0; i < n; i++) {
    const r = bm.rows[i];
    if (!r) continue;
    lastRow = i;
    const [a, str] = r;
    for (let j = 0; j < str.length; j++) {
      const lv = str.charCodeAt(j) - 48;
      if (lv <= 0) continue;
      const c = BOOK_PAL[lv], o = ((nk - 1 - (a + j)) * n + i) * 4;
      img.data[o] = c[0]; img.data[o + 1] = c[1]; img.data[o + 2] = c[2]; img.data[o + 3] = Math.round(c[3] * 255);
    }
  }
  g.putImageData(img, 0, 0);
  bookImg = { off, n, nk, k0: bm.k0, S: bm.S, levels: bm.levels, rows: bm.rows, lastRow, since: bm.since };
}
function drawBookMap(w, alpha) {
  if (!bookImg || !data || bookImg.n !== data.candles.length) return;
  const ts = chart.timeScale(), cs = data.candles, n = bookImg.n;
  const xa = ts.timeToCoordinate(cs[0].time), xb = ts.timeToCoordinate(cs[n - 1].time);
  const yTop = series.priceToCoordinate((bookImg.k0 + bookImg.nk) * bookImg.S), yBot = series.priceToCoordinate(bookImg.k0 * bookImg.S);
  if (xa === null || xb === null || yTop === null || yBot === null) return;
  const bs = n > 1 ? (xb - xa) / (n - 1) : ts.options().barSpacing;
  ctx.save();
  ctx.imageSmoothingEnabled = false;
  ctx.globalAlpha = alpha;
  ctx.drawImage(bookImg.off, 0, 0, n, bookImg.nk, xa - bs / 2, yTop, n * bs, yBot - yTop);
  // el libro de ahora se alarga hacia la zona futura (órdenes que siguen puestas)
  const ps = chart.priceScale('right'), pw = (ps && ps.width && ps.width()) || 62;
  const xr = xa + (bookImg.lastRow + 0.5) * bs;
  if (bookImg.lastRow >= 0 && xr < w - pw) {
    ctx.globalAlpha = alpha * 0.6;
    ctx.drawImage(bookImg.off, bookImg.lastRow, 0, 1, bookImg.nk, xr, yTop, w - pw - xr, yBot - yTop);
  }
  ctx.restore();
}
function bookAt(t, price) {
  // nivel del mapa de liquidez en esa vela y precio -> [desde, hasta] en USD
  if (!bookImg || price === null || price === undefined) return null;
  const i = tindex[t];
  const row = i === undefined ? null : bookImg.rows[i];
  if (!row) return null;
  const k = Math.floor(price / bookImg.S) - bookImg.k0 - row[0];
  const lv = k >= 0 && k < row[1].length ? row[1].charCodeAt(k) - 48 : 0;
  if (lv <= 0) return null;
  return [bookImg.levels[lv - 1], lv < bookImg.levels.length ? bookImg.levels[lv] : null];
}
function bookHeader() {
  if (!bookImg) return data.book_map && data.book_map.error ? 'libro: error' : 'libro: grabando (aún sin datos)';
  return `libro de órdenes · tramos de ${fmt(bookImg.S)} $ · desde ${fmtLocalFull(bookImg.since)}`;
}

// Hyperliquid real: las posiciones más grandes y su precio de liquidación exacto, a la derecha de la última vela
function drawHl(w, h) {
  if (!cfg.hl || !data || !data.hl || !data.hl.top || !data.hl.top.length) return;
  const ts = chart.timeScale(), cs = data.candles;
  const ps = chart.priceScale('right');
  const xEnd = w - ((ps && ps.width && ps.width()) || 62) - 4;
  const xl = ts.timeToCoordinate(cs[cs.length - 1].time);
  const x0 = xl === null ? xEnd - 160 : Math.max(0, Math.min(xEnd - 60, xl + 6));
  fctx.font = '10px system-ui, sans-serif';
  const used = [];
  // la cabecera (arriba a la izquierda) puede tapar rótulos en el móvil: ahí solo la línea
  const info = document.getElementById('info');
  const iy = (info.offsetTop || 8) + (info.offsetHeight || 0) + 4, ix = (info.offsetLeft || 10) + (info.offsetWidth || 0);
  // de mayor a menor: si dos quedan pegadas, el rótulo es para la más grande y la otra solo lleva la línea
  const items = data.hl.top.filter(it => it[2] >= 100000).sort((a, b) => b[2] - a[2]).slice(0, 6)
    .map(it => [series.priceToCoordinate(it[0]), it]).filter(([y]) => y !== null && y >= 0 && y <= h);
  for (const [y, [, side, usd, lev]] of items) {
    const col = side === 1 ? '#ff9f1c' : '#2ec4ff';
    fctx.setLineDash([4, 3]); fctx.strokeStyle = col; fctx.lineWidth = 1.2;
    fctx.beginPath(); fctx.moveTo(x0, y); fctx.lineTo(xEnd, y); fctx.stroke(); fctx.setLineDash([]);
    if (used.some(u => Math.abs(u - y) < 13)) continue;
    const label = `HL ${side === 1 ? 'largo' : 'corto'} ${fmtM(usd)} · ${Math.round(lev)}x`;
    const tw = fctx.measureText(label).width;
    if (y < iy && xEnd - tw - 6 < ix) continue;
    used.push(y);
    fctx.fillStyle = 'rgba(0,0,0,0.78)'; fctx.fillRect(xEnd - tw - 6, y - 12, tw + 6, 12);
    fctx.fillStyle = col; fctx.fillText(label, xEnd - tw - 3, y - 3);
  }
}

function render() {
  requestAnimationFrame(render);
  if (!data) return;
  const s = signature();
  if (s === lastSig) return;
  lastSig = s;
  const dpr = window.devicePixelRatio || 1;
  const w = wrap.clientWidth, h = wrap.clientHeight;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) {
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  M = mapper();
  const yMax = priceBottom();            // el mapa no invade los paneles inferiores
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, w, yMax); ctx.clip();
  if (cfg.map !== 'liq') drawBookMap(w, cfg.map === 'both' ? 0.8 : 1);   // libro de órdenes debajo
  if (cfg.map !== 'book') {
    drawFutureTint(w, yMax);
    drawTime(w, yMax);
    drawProfile(w);
  }
  ctx.restore();
  if (fx.width !== cv.width || fx.height !== cv.height) { fx.width = cv.width; fx.height = cv.height; }
  fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  fctx.clearRect(0, 0, w, h);
  fctx.save(); fctx.beginPath(); fctx.rect(0, 0, w, yMax); fctx.clip();
  drawLiqs(w, yMax);
  drawBook(w, yMax);
  drawHl(w, yMax);
  fctx.restore();
  drawPanes(w);
}

function updateZoneLines() {
  // capa «Zonas»: rótulos en el eje de la zona fuerte más cercana arriba, abajo y la mayor
  zoneLines.forEach(l => series.removePriceLine(l));
  zoneLines = [];
  if (!data || !showZones || !data.zones || !data.zones.length) return;
  const px = livePrice ?? data.price;
  const zs = data.zones.filter(z => Math.abs(z.price - px) / px <= FIT_WIN[tf] / 100);   // las que entran en el encuadre
  if (!zs.length) return;
  const strong = zs.filter(z => z.ratio >= 0.3);
  const above = strong.filter(z => z.price > px).sort((a, b) => a.price - b.price)[0];
  const below = strong.filter(z => z.price < px).sort((a, b) => b.price - a.price)[0];
  const biggest = zs.reduce((m, z) => (z.total > m.total ? z : m), zs[0]);
  const picked = [];
  for (const z of [above, below, biggest]) if (z && !picked.includes(z)) picked.push(z);
  for (const z of picked) {
    const long = z.side === 'long';
    const d = z.price - px;
    zoneLines.push(series.createPriceLine({
      price: z.price, color: long ? '#ff9f1c' : '#2ec4ff', lineWidth: 1, lineStyle: 1, axisLabelVisible: true,
      title: `${long ? 'largos' : 'cortos'} ≈${fmtM(z.total)} · ${d >= 0 ? '+' : '−'}${fmt(Math.abs(d))} pts`
    }));
  }
}

function updateBias() {
  // es del mapa de liquidaciones: con solo el libro de órdenes no se enseña

  const px = livePrice ?? data.price, w = BIAS_WIN[tf] / 100;
  let up = 0, dn = 0;

function flushLive(force) {

  lastLiveUi = now;
  if (livePrice !== null) setPriceLine(livePrice, previousLivePrice === null || livePrice >= previousLivePrice ? '#26a69a' : '#ef5350');
  if (liveBar) series.update({ ...liveBar });
  updateZones(); updateStatus(); updateBias();
  if (showZones && now - lastZoneLines > 10000) { lastZoneLines = now; updateZoneLines(); }

function updateLivePrice(price, tradeMs) {
  if (!Number.isFinite(price) || price <= 0) return;
  previousLivePrice = livePrice;
  livePrice = price;
  // entre mensajes de vela, el precio tick a tick mueve la vela actual
  if (liveBar) {
    const t = Math.floor((tradeMs || Date.now()) / 1000 / TFS[tf]) * TFS[tf];
    if (t > liveBar.time) liveBar = { time: t, open: price, high: price, low: price, close: price };
    else if (t === liveBar.time) {
      liveBar.close = price;
      if (price > liveBar.high) liveBar.high = price;
      if (price < liveBar.low) liveBar.low = price;
    }
  }
  flushLive(false);
}

function onKline(k) {
  // vela oficial de Binance: manda sobre la reconstrucción tick a tick
  if (!k || k.i !== tf) return;
  const t = Math.floor(k.t / 1000);
  if (liveBar && t < liveBar.time) return;
  liveBar = { time: t, open: +k.o, high: +k.h, low: +k.l, close: +k.c };
  if (k.q !== undefined && k.Q !== undefined) setCvdLive(t, 2 * +k.Q - +k.q);   // compras − ventas a mercado (USD)
  flushLive(false);
}

function connectBinance() {
  if (ws) {
    const old = ws;
    old.onopen = old.onmessage = old.onerror = old.onclose = null;
    try { old.close(); } catch (e) {}
    ws = null;
  }
  if (wsRetry) { clearTimeout(wsRetry); wsRetry = null; }
  wsLive = false;
  const sym = String((data && data.symbol) || 'BTCUSDT').toLowerCase();
  // Binance (2026): operaciones y velas van por la ruta /market
  const url = `wss://fstream.binance.com/market/stream?streams=${sym}@aggTrade/${sym}@kline_${tf}`;
  let sock;
  try { sock = new WebSocket(url); } catch (e) { scheduleReconnect(); return; }
  ws = sock;
  sock.onopen = () => { if (ws !== sock) return; wsLive = true; if (data) updateStatus(); };
  sock.onmessage = (event) => {
    if (ws !== sock) return;
    try {
      const msg = JSON.parse(event.data);
      const d = msg.data || msg;
      wsLive = true;
      if (d.e === 'aggTrade') updateLivePrice(parseFloat(d.p), d.T);
      else if (d.e === 'kline') onKline(d.k);
    } catch (e) { console.warn('WS parse error', e); }
  };
  sock.onerror = () => { try { sock.close(); } catch (e) {} };
  sock.onclose = () => { if (ws !== sock) return; wsLive = false; if (data) updateStatus(); scheduleReconnect(); };
}

function scheduleReconnect() {
  if (wsRetry) return;
  wsRetry = setTimeout(() => { wsRetry = null; connectBinance(); }, 3000);
}

const EX_NAME = { binance: 'Binance', bybit: 'Bybit', okx: 'OKX', deribit: 'Deribit', bitmex: 'BitMEX', hyperliquid: 'Hyperliquid', bitget: 'Bitget',
  gate: 'Gate', htx: 'HTX', otros: 'Otros (Coinalyze)' };
const LIQ_EX = ['binance', 'bybit', 'okx', 'deribit', 'bitmex', 'bitget', 'gate', 'htx'];
const TOAST_MIN = 250000, PULSE_MIN = 50000;

function applyLiveLiq(ev, fresh) {
  const [rowid, ts, ex, side, px, usd] = ev;
  if (!data || !data.liqs || rowid <= (data.liqs.rowid || 0)) return;   // ya venía en los datos del servidor
  const step = TFS[tf];
  const tc = Math.floor(ts / 1000 / step) * step;
  if (tc < data.candles[0].time) return;
  const hv = liqHist.get(tc) || [0, 0];
  hv[side === 1 ? 0 : 1] += usd;
  liqHist.set(tc, hv);
  if (usd >= 5000) data.liqs.items.push([tc, px, side, usd]);
  version++;
  if (fresh) { pulseAt(tc, px, side, usd); queueToast(ex, side, px, usd); }
}

async function pollLive() {
  try {
    const r = await fetch('/api/live?after=' + liveCursor + (K ? '&k=' + encodeURIComponent(K) : ''), { cache: 'no-store' });
    const j = await r.json();
    if (j.error) return;
    liveCursor = j.cursor;
    for (const ev of j.events || []) { liveBuf.push(ev); applyLiveLiq(ev, true); }
    if (liveBuf.length > 800) liveBuf = liveBuf.slice(-500);
  } catch (e) {}
}

function pulseAt(tc, px, side, usd) {
  if (usd < PULSE_MIN) return;
  const x = chart.timeScale().timeToCoordinate(tc), y = series.priceToCoordinate(px);
  if (x === null || y === null || y < 0 || y > priceBottom()) return;
  const sz = Math.round(12 + Math.min(34, Math.sqrt(usd / 1e4) * 3));
  const el = document.createElement('div');
  el.className = 'pulse' + (side === 1 ? '' : ' short');
  Object.assign(el.style, { left: (x - sz / 2) + 'px', top: (y - sz / 2) + 'px', width: sz + 'px', height: sz + 'px' });
  wrap.appendChild(el);
  setTimeout(() => el.remove(), 1500);
}

function queueToast(ex, side, px, usd) {
  // junta las liquidaciones de 2,5 s del mismo lado en un solo aviso (cascadas)
  const b = toastBuf[side] || (toastBuf[side] = { usd: 0, n: 0, lo: px, hi: px, ex: new Set() });
  b.usd += usd; b.n += 1; b.lo = Math.min(b.lo, px); b.hi = Math.max(b.hi, px); b.ex.add(ex);
  if (!b.timer) b.timer = setTimeout(() => flushToast(side), 2500);
}

function flushToast(side) {
  const b = toastBuf[side];
  delete toastBuf[side];
  if (!b || b.usd < TOAST_MIN) return;
  const long = side === 1;
  const where = b.hi - b.lo < 1 ? fmt(b.lo) : `${fmt(b.lo)}–${fmt(b.hi)}`;
  const el = document.createElement('div');
  el.className = 'toast' + (long ? '' : ' short');
  el.innerHTML = `⚡ <b>${fmtM(b.usd)}</b> en ${long ? '<span class="L">largos</span>' : '<span class="S">cortos</span>'} liquidados · ${where}` +
    `<br><span class="muted2">${b.n} ${b.n > 1 ? 'órdenes' : 'orden'} · ${[...b.ex].map(x => EX_NAME[x] || x).join(', ')}</span>`;
  toastsEl.prepend(el);
  while (toastsEl.children.length > 3) toastsEl.lastChild.remove();
  setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 450); }, 6000);
}

const POOL_TIERS = [3, 5, 10, 25, 50, 100];
function poolReadout(price) {
  const pv = (t) => document.querySelector(`[data-pv="${t}"]`);
  if (!data || !data.heat.active || price === null || price === undefined) {
    POOL_TIERS.forEach(t => { pv(t).textContent = '–'; });
    document.getElementById('pTot').textContent = '–';
    document.getElementById('pCum').textContent = '';
    return;
  }
  const size = data.heat.size;
  const row = data.heat.active.find(a => Math.abs(a[0] - price) <= size / 2);
  POOL_TIERS.forEach(t => {
    const i = ALL.indexOf(t);
    pv(t).textContent = row && row[3] ? fmtM(row[3][i] || 0) : '0';
  });
  document.getElementById('pTot').textContent = row ? fmtM(row[1] + row[2]) : '0';
  const { px, upC, dnC } = cumulativeSides();
  let cum = 0, side = '';
  // incluye el tramo que está bajo el cursor (su centro puede quedar medio tramo más allá)
  if (price > px) { for (const [p, c] of upC) { if (p <= price + size / 2) cum = c; else break; } side = 'cortos'; }
  else { for (const [p, c] of dnC) { if (p >= price - size / 2) cum = c; else break; } side = 'largos'; }
  document.getElementById('pCum').textContent = cum > 0 ? `Si llega aquí: ≈${fmtM(cum)} ${side}` : '';
}
function paneReadout(t) {
  const el = document.getElementById('pAt');
  if (!t || !data) { el.textContent = ''; return; }
  const parts = [];
  const d = doiMap.get(t), hv = liqHist.get(t), cd = cvdD.get(t);
  if (d !== undefined) parts.push(`ΔOI ${d >= 0 ? '+' : ''}${fmtM(d)}`);
  if (hv && (hv[0] || hv[1])) parts.push(`liquidado: largos ${fmtM(hv[0])} · cortos ${fmtM(hv[1])}`);
  if (cd && paneList().includes('cvd') && (cd[0] !== null || cd[1] !== null))
    parts.push(`delta: fut. ${cd[0] === null ? '–' : sgnM(cd[0])} · spot ${cd[1] === null ? '–' : sgnM(cd[1])}`);
  const i = tindex[t], on = paneList();
  if (i !== undefined && on.includes('fund') && fundAt[i] !== null && fundAt[i] !== undefined) parts.push(`funding ${(fundAt[i] * 100).toFixed(4)} %`);
  if (i !== undefined && on.includes('fuel') && fuelArr[i]) parts.push(`gasolina ▲ ${fmtM(fuelArr[i][1])} ▼ ${fmtM(fuelArr[i][0])}`);

}

  document.getElementById('bAuto').classList.toggle('on', auto);

    const base = cfg.model === 'auto' && data && data.levs ? data.levs.slice() : curLevs().slice();

let helpBuilt = false;
function buildHelp() {
  const ico = (k) => k === null ? '' : HELP_ICON[k] || `<span class="ic t">${k}</span>`;
  helpEl.innerHTML = `<div class="hh"><b>Manual</b><button class="x" id="hClose" title="Cerrar">✕</button></div>
    <div class="muted">Qué es cada cosa, en sencillo. Toca un apartado para abrirlo.</div>` +
    HELP.map(([c, title, items]) => `<details style="--c:${c}"><summary>${title}</summary>` +
      items.map(([k, name, txt]) => `<div class="it">${ico(k)}<div><b>${name}</b> · ${txt}</div></div>`).join('') + '</details>').join('') +
    '<div class="muted" style="margin-top:8px">Es una herramienta de contexto: no es una recomendación ni una señal de entrada.</div>';
  document.getElementById('hClose').onclick = closeHelp;
  helpBuilt = true;
}
function helpAsiaText() {
  // horas de la sesión asiática en la hora de quien mira (el servidor la define en UTC)
  const a = data && data.asia, d = new Date();
  const s = a ? a.start : Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate(), 0) / 1000, e = a ? a.end : s + 7 * 3600;
  const h = (t) => new Date(t * 1000).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
  return `de ${h(s)} a ${h(e)}, tu hora`;
}
function closeHelp() { helpEl.style.display = 'none'; }
bHelp.onclick = () => {
  if (helpEl.style.display === 'block') { closeHelp(); return; }
  cfgEl.style.display = 'none'; closeVal(); closeSig();
  if (!helpBuilt) buildHelp();
  const ha = document.getElementById('helpAsia');
  if (ha) ha.textContent = helpAsiaText();
  helpEl.style.display = 'block';
};
window.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closeHelp(); closeSig(); } });
